.t:hover{background:var(--pri2)}.t.on{background:var(--pb);color:#fff}.t small{opacity:.7;margin-left:6px}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.bd{font-size:11.5px;border-radius:10px;padding:2px 9px;border:1px solid var(--line)}.b1{color:var(--mid);border-color:var(--mid)}.b2{color:var(--ok);border-color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}label.f{font-size:12px;color:var(--mut);display:block}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0 10px;padding-bottom:4px}.tabs button{white-space:nowrap;font-size:13px}.tabs button.on{background:var(--pb);color:#fff;border-color:var(--pb)}
.std{background:var(--pri2);border-left:4px solid var(--acc);padding:9px 12px;border-radius:4px;font-size:13.5px;margin-bottom:10px}

.lv span{display:block;border:1px solid var(--line);border-radius:6px;padding:4px 9px;font-size:12px;white-space:nowrap}

.lv input:checked+span.y{background:var(--ok);color:#fff;border-color:var(--ok)}.lv input:checked+span.k{background:var(--mid);color:#fff;border-color:var(--mid)}.lv input:checked+span.g{background:var(--bad);color:#fff;border-color:var(--bad)}

.rgrid{display:grid;grid-template-columns:260px 1fr;gap:14px;align-items:center}@media(max-width:700px){.rgrid{grid-template-columns:1fr}}
table.tb{width:100%;border-collapse:collapse;font-size:12.5px}.tb th,.tb td{border-bottom:1px solid var(--line);padding:6px;text-align:center}.tb th{position:sticky;top:0;background:var(--card)}.tb td:nth-child(2),.tb th:nth-child(2){text-align:left}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.msg{font-size:13px;color:var(--ok)}.msg.err{color:var(--bad)}
.sm{font-size:12px;color:var(--mut)}
#pr{display:none}
@page{size:A4;margin:0}
@media print{body{background:#fff}#app{display:none!important}#pr{display:block!important;padding:14mm;color:#000;background:#fff;font:11px/1.35 Arial,sans-serif}

#yr,#yr option{background:#fff;color:#111827}#yr option:checked{background:#dbeafe;color:#111827}

/* ---------- Gelişmiş profesyonel katman ---------- */
:root{--gold:#b78628;--soft:#f7f4ec;--shadow:0 10px 28px rgba(15,39,70,.08)}
.card{box-shadow:var(--shadow)}
.top{position:sticky;top:0;z-index:20;box-shadow:0 3px 18px rgba(0,0,0,.12)}
.insight{border-left:4px solid var(--pri);background:linear-gradient(135deg,var(--pri2),var(--card));padding:12px 14px;border-radius:8px;margin:10px 0}
.insight.warn{border-left-color:var(--mid)}.insight.good{border-left-color:var(--ok)}.insight.bad{border-left-color:var(--bad)}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin:10px 0}.metric{padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card)}.metric b{font:700 24px Georgia,serif;display:block}.metric span{font-size:12px;color:var(--mut)}
.timeline{border-left:2px solid var(--line);padding-left:16px;margin:10px 0}.timeline-item{position:relative;margin:0 0 14px}.timeline-item:before{content:"";position:absolute;left:-22px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--pri)}
.flag{display:inline-flex;align-items:center;gap:5px;border-radius:12px;padding:3px 9px;font-size:11px;border:1px solid var(--line);background:var(--card)}
.flag.priority{color:var(--bad);border-color:var(--bad)}.flag.follow{color:var(--mid);border-color:var(--mid)}.flag.ok{color:var(--ok);border-color:var(--ok)}
.help{font-size:11.5px;color:var(--mut);margin-top:4px}.autosave{font-size:12px;color:var(--ok);min-height:18px}
@media(max-width:700px){.top{position:static}.metric-grid{grid-template-columns:repeat(2,1fr)}}
@media print{.top,.acts,nav,#app{display:none!important}}

function radar(v){const cx=110,cy=110,R=80,pt=(i,r)=>{const a=-Math.PI/2+i*2*Math.PI/8;return [cx+R*r*Math.cos(a),cy+R*r*Math.sin(a)]};

const cp=m=>{const b=$("#bx");b.select();try{navigator.clipboard.writeText(b.value)}catch(e){}$("#bm").textContent=m};
$("#bx1").onclick=()=>{$("#bx").value=["Sıra","Ad Soyad","Görev","Sınıf","Durum",...SH,"Genel","Düzey"].join("\t")+"\n"+rows().map((r,i)=>[i+1,r.t[0],r.t[1],r.t[2],["Başlanmadı","Taslak","Tamamlandı"][r.s],...A.map((_,k)=>r.v?Math.round(r.v[k]):""),r.a?Math.round(r.a):"",r.s==2?LN[lvOf(r.a)]:""].join("\t")).join("\n");cp("Tablo hazır; Excel'e yapıştırabilirsiniz.")};
$("#bx2").onclick=()=>{$("#bx").value=JSON.stringify(DB);cp("Yedek hazır ve kopyalandı.")};
$("#bx3").onclick=()=>{try{const o=JSON.parse($("#bx").value);Object.keys(o).forEach(k=>{if(P.some(t=>t[0]==k)){DB[k]=o[k];persist(k)}});$("#bm").textContent="Yedek yüklendi.";renderRap()}catch(e){$("#bm").textContent="Geçersiz yedek metni."}}}
go("panel");

/* ---------- Gelişmiş profesyonel sürüm ---------- */
const META=()=>D.meta||(D.meta={priority:"normal",followDate:"",owner:"",evidence:"",meeting:"",statusNote:""});
const esc2=esc;
function metaOf(n){const d=DB[n];return d&&d.meta?d.meta:{};}
function overdue(n){const m=metaOf(n);return m.followDate&&new Date(m.followDate+"T23:59:59")<new Date()&&st(n)!=0}
function dueLabel(n){const m=metaOf(n);return m.followDate?fmt(m.followDate):"Tarih belirlenmedi"}
function renderEnhancedRes(){
 const m=META(),v=A.map((_,i)=>ap(D,i)),av=avg(D),w=[];A.forEach((a,i)=>a[2].forEach((x,j)=>{if(D.r[i+"_"+j]=="g")w.push([i,j,x])}));
 const completed=Object.keys(D.r).length, total=TOT, ready=completed==total;
 $("#res").innerHTML=`<h2>Sonuç, kanıt ve gelişim planı</h2>
 <div class="metric-grid"><div class="metric"><b>%${Math.round(av)}</b><span>Genel yeterlik oranı</span></div><div class="metric"><b>${completed}/${total}</b><span>Doldurulan gösterge</span></div><div class="metric"><b>${w.length}</b><span>Gelişim önceliği</span></div><div class="metric"><b>${ready?"Hazır":"Eksik"}</b><span>Onay durumu</span></div></div>
 <div class="rgrid"><div>${radar(v)}</div><div>${A.map((_,i)=>`<div class="ar"><span>${i+1}. ${SH[i]}</span>${bar(v[i])}<b>%${Math.round(v[i])}</b></div>`).join("")}<p><b>Genel düzey: ${av?LN[lvOf(av)]:"—"}</b></p><p class="help">Yeterlik oranı karar destek amaçlıdır; tek başına resmî performans puanı olarak kullanılmamalıdır.</p></div></div>
 <div class="g2"><div class="card" style="padding:10px"><h3>Gelişim öncelikleri (${w.length})</h3>${w.map(x=>`<div class="insight bad"><span class="flag priority">Alan ${x[0]+1}</span> ${esc2(x[2])}</div>`).join("")||"<p class='sm'>Gelişim önceliği işaretlenmedi.</p>"}</div><div class="card" style="padding:10px"><h3>İzleme kaydı</h3><label class="f">Öncelik düzeyi<select data-m="priority"><option value="normal" ${m.priority=="normal"?"selected":""}>Normal</option><option value="oncelikli" ${m.priority=="oncelikli"?"selected":""}>Öncelikli takip</option><option value="kritik" ${m.priority=="kritik"?"selected":""}>Acil gelişim desteği</option></select></label><label class="f">Sonraki izleme tarihi<input type="date" data-m="followDate" value="${esc2(m.followDate)}"></label><label class="f">Takipten sorumlu kişi<input data-m="owner" value="${esc2(m.owner)}" placeholder="Ad soyad / kurul"></label></div></div>
 <div class="two"><label class="f">Öğretmenin görüşü<textarea data-f="o" placeholder="Öğretmenin kendi değerlendirmesi, ihtiyaçları ve önerileri…">${esc2(D.o)}</textarea></label><label class="f">Müdürün genel değerlendirmesi<textarea data-f="m" placeholder="Gözleme dayalı güçlü yönler ve somut geri bildirim…">${esc2(D.m)}</textarea></label></div>
 <div class="two"><label class="f">Önerilen gelişim faaliyetleri / eylem planı<textarea data-f="p" placeholder="Faaliyet · sorumlu · hedef tarih · başarı ölçütü…">${esc2(D.p)}</textarea></label><label class="f">Gözlem kanıtları / belge referansları<textarea data-m="evidence" placeholder="Ders planı, öğrenci ürünü, gözlem notu, toplantı tutanağı vb. referanslar…">${esc2(m.evidence)}</textarea></label></div>
 <div class="two"><label class="f">Geri bildirim / görüşme notu<textarea data-m="meeting" placeholder="Görüşmede ele alınan başlıklar ve mutabakat…">${esc2(m.meeting)}</textarea></label><label class="f">Durum notu<textarea data-m="statusNote" placeholder="Takip sürecinin mevcut durumu…">${esc2(m.statusNote)}</textarea></label></div>
 <div class="insight ${ready?"good":"warn"}">${ready?"Form onaya hazır. Gelişim planı ve takip tarihini kontrol ederek tamamlayabilirsiniz.":"Onaydan önce tüm göstergelerin değerlendirilmesi gerekir."}</div>`;
}
function renderTakip(){
 const items=P.map(t=>{const d=DB[t[0]],m=metaOf(t[0]);return {t,d,m,s:st(t[0]),a:d?avg(d):0}}).filter(x=>x.s||x.m.followDate);
 const priority=items.filter(x=>x.m.priority&&x.m.priority!="normal").sort((a,b)=>({kritik:0,oncelikli:1}[a.m.priority]??2)-({kritik:0,oncelikli:1}[b.m.priority]??2));
 const upcoming=items.filter(x=>x.m.followDate).sort((a,b)=>a.m.followDate.localeCompare(b.m.followDate));
 $("#v-takip").innerHTML=`<div class="card"><h2>Takip ve gelişim merkezi</h2><p class="sm">Tamamlanan değerlendirmelerden sonra belirlenen gelişim önceliklerini, takip tarihlerini ve sorumluları tek ekranda izleyin.</p><div class="metric-grid"><div class="metric"><b>${priority.length}</b><span>Öncelikli takip</span></div><div class="metric"><b>${upcoming.length}</b><span>Takip tarihi tanımlı</span></div><div class="metric"><b>${items.filter(x=>overdue(x.t[0])).length}</b><span>Takip tarihi geçen</span></div><div class="metric"><b>${items.filter(x=>x.m.evidence).length}</b><span>Kanıt kaydı bulunan</span></div></div><h3>Öncelikli takip listesi</h3>${priority.length?`<div class="timeline">${priority.map(x=>`<div class="timeline-item"><b>${esc2(x.t[0])}</b> <span class="flag ${x.m.priority=="kritik"?"priority":"follow"}">${x.m.priority=="kritik"?"Acil":"Öncelikli"}</span><div class="sm">${esc2(x.t[1])} · Genel oran: %${Math.round(x.a)} · Sorumlu: ${esc2(x.m.owner||"Belirlenmedi")}</div><div class="sm">İzleme: ${esc2(dueLabel(x.t[0]))}${overdue(x.t[0])?" · <b style='color:var(--bad)'>Tarih geçti</b>":""}</div><button class="chip" data-open="${esc2(x.t[0])}">Kaydı aç</button></div>`).join("")}</div>`:"<p class='sm'>Öncelikli takip kaydı bulunmuyor.</p>"}<h3>Yaklaşan / planlanan izlemeler</h3>${upcoming.length?`<div style="overflow-x:auto"><table class="tb"><tr><th>Öğretmen</th><th>Takip tarihi</th><th>Sorumlu</th><th>Durum</th><th></th></tr>${upcoming.map(x=>`<tr><td style="text-align:left">${esc2(x.t[0])}</td><td>${esc2(dueLabel(x.t[0]))}</td><td>${esc2(x.m.owner||"—")}</td><td>${overdue(x.t[0])?"Tarihi geçti":x.s==2?"Tamamlandı":"Devam ediyor"}</td><td><button class="chip" data-open="${esc2(x.t[0])}">Aç</button></td></tr>`).join("")}</table></div>`:"<p class='sm'>Takip tarihi tanımlanmamış.</p>"}<h3>Profesyonel kullanım ilkeleri</h3><div class="insight"><b>Kanıta dayalı değerlendirme:</b> Her gelişim notu gözlem, ürün, plan veya görüşme gibi bir kanıtla ilişkilendirilebilir.</div><div class="insight"><b>Gelişim odaklı yaklaşım:</b> Değerlendirme sonucu yalnızca puan değil; hedef, sorumlu, tarih ve başarı ölçütü içeren eylem planına dönüştürülür.</div><div class="insight"><b>Gizlilik:</b> Veriler yalnızca bu tarayıcıda saklanır. Ortak bilgisayarlarda işlem bitince yedekleri ve tarayıcı verilerini güvenli biçimde yönetin.</div></div>`;
 $("#v-takip").onclick=e=>{const b=e.target.closest("[data-open]");if(b){go("form");pick(b.dataset.open);tab=8;show()}};
}
/* Sonuç görünümünü ve navigasyonu gelişmiş sürümle değiştir */
renderRes=renderEnhancedRes;
const originalGo=go;
go=function(v){["panel","form","rap","takip"].forEach(k=>{const el=$("#v-"+k);if(el)el.hidden=k!=v});$$("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v==v));if(v=="panel")renderPanel();if(v=="rap")renderRap();if(v=="form")renderList();if(v=="takip")renderTakip();scrollTo(0,0)};
/* Metadata ve otomatik kaydetme */
$("#fm").addEventListener("change",e=>{const t=e.target;if(t.dataset.m){META()[t.dataset.m]=t.value;commit();say("İzleme kaydı güncellendi.")}});
let autosaveTimer;$("#fm").addEventListener("input",e=>{if(e.target.dataset.m||e.target.dataset.f){clearTimeout(autosaveTimer);autosaveTimer=setTimeout(()=>{if(cur&&D){commit();say("Otomatik kaydedildi.")}},700)}});
/* Yedek paketine sürüm bilgisi ve son değişiklik zamanını ekle */
const makeBackup=()=>({schema:"mni-ogretmen-v2",year:YR,exportedAt:new Date().toISOString(),records:DB});
const oldBx2=$("#bx2");if(oldBx2)oldBx2.onclick=()=>{$("#bx").value=JSON.stringify(makeBackup());cp("Sürüm bilgili yedek hazır ve kopyalandı.")};
const oldBx3=$("#bx3");if(oldBx3)oldBx3.onclick=()=>{try{const raw=JSON.parse($("#bx").value),o=raw.records||raw;Object.keys(o).forEach(k=>{if(P.some(t=>t[0]==k)){DB[k]=o[k];persist(k)}});$("#bm").textContent="Yedek yüklendi.";renderRap()}catch(e){$("#bm").textContent="Geçersiz yedek metni."}};
$("#bx4").onclick=()=>{const blob=new Blob([JSON.stringify(makeBackup(),null,2)],{type:"application/json;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download=`ogretmen-izleme-yedek-${YR}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);$("#bm").textContent="JSON yedeği indirildi."};
$("#bx5").onclick=()=>$("#jsonFile").click();
$("#jsonFile").onchange=async e=>{const file=e.target.files[0];if(!file)return;try{const raw=JSON.parse(await file.text()),o=raw.records||raw;if(!o||typeof o!=="object"||Array.isArray(o))throw new Error("bad backup");let count=0;Object.keys(o).forEach(k=>{if(P.some(t=>t[0]==k)){DB[k]=o[k];persist(k);count++}});$("#bm").textContent=count?`${count} kayıt JSON dosyasından yüklendi.`:"Bu yedekte tanınan kayıt bulunamadı.";renderRap()}catch(e){$("#bm").textContent="Geçersiz JSON yedek dosyası."}e.target.value=""};
/* İlk açılışta yeni takip merkeziyle birlikte çalış */
go("panel");
</script>
